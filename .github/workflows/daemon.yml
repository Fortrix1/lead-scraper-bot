name: Maps Daemon (scheduled)

# Runs the daemon on GitHub's free compute. Every 10 minutes a fresh
# throwaway machine: checks Redis for one /find job — if none, it may
# run ONE fresh-store "tick" (one crt.sh letter-slice + a batch of
# age-checks). Nothing persists between runs except Redis.

on:
  schedule:
    # Offset from the round 10-minute marks — those are GitHub's busiest
    # moments and most prone to delay.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {}       # manual trigger from the Actions tab, for testing

# Only one run at a time.
concurrency:
  group: maps-daemon
  cancel-in-progress: false

jobs:
  run-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # safety cap

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # One-line verdict on whether crt.sh answers this run's IP at all.
      # 200 = fine. 504/timeout = heavy load, retries will cope.
      # 403 = hard IP block -> add a CRTSH_RELAY_URL secret (Cloudflare
      # Worker relay) and everything routes through it automatically.
      - name: Probe crt.sh from this IP
        run: curl -s -o /dev/null -w "crt.sh says HTTP %{http_code}\n" --max-time 25 "https://crt.sh/json?q=shops.myshopify.com"

      # [NEW] Same heavy wildcard query the daemon's slice-sweep actually
      # uses. The simple probe above hits crt.sh with one exact domain name
      # (cheap); this one asks for every cert starting with "a" under
      # myshopify.com (expensive). If this one fails to even connect while
      # the simple probe succeeds, that tells us crt.sh is dropping the
      # expensive wildcard query specifically — a different problem than an
      # IP block, with a different fix.
      - name: Probe crt.sh with the SAME heavy wildcard query the daemon uses
        run: curl -s -o /tmp/wild.json -w "wildcard query -> HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" --max-time 60 "https://crt.sh/json?q=a%25.myshopify.com&exclude=expired"

      # [NEW] Print exactly what crt.sh sent back for that wildcard query.
      # 138 bytes is too small to be real cert data for a letter this
      # common — this shows us whether it's an empty array, an error
      # object, or something else so we know what we're actually dealing
      # with instead of guessing from a byte count.
      - name: Show the wildcard query response body
        run: cat /tmp/wild.json; echo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium + OS dependencies for Playwright
        run: playwright install --with-deps chromium

      - name: Install a virtual display (Xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore Google Maps cookies from secret
        # Written fresh every run, never committed.
        run: echo '${{ secrets.GM_COOKIES_JSON }}' > gm_cookies.json

      - name: Run the daemon (single pass)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SCRAPER_BOT_TOKEN: ${{ secrets.SCRAPER_BOT_TOKEN }}
          # Optional: only needed if the probe above shows 403.
          # When set, ALL crt.sh traffic goes through your relay instead.
          CRTSH_RELAY_URL: ${{ secrets.CRTSH_RELAY_URL }}
          RUN_MODE: once
        run: xvfb-run --auto-servernum python3 maps_daemon.py
